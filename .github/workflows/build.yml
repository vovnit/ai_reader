# Builds the installable file of every app. Each run keeps them as the run's
# artifacts; a pushed tag like v1.2 also attaches them to a GitHub release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      # The extension targets iOS 27, so the SDK must come from Xcode 27.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "27.0"
      # Unsigned: signing needs the owner's certificate. AltStore, Sideloadly
      # and the like sign the .ipa with the installer's own Apple ID.
      - name: Archive
        run: |
          xcodebuild archive -project AIReader/AIReader.xcodeproj -scheme AIReader \
            -destination 'generic/platform=iOS' -archivePath build/AIReader.xcarchive \
            -skipMacroValidation CODE_SIGNING_ALLOWED=NO
      - name: Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/AIReader.xcarchive/Products/Applications/AIReader.app build/ipa/Payload/
          cd build/ipa && zip -qry ../AIReader-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: build/AIReader-unsigned.ipa

  kindle:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [kindlehf, kindlepw2]
    steps:
      - uses: actions/checkout@v4
      # As root: the container writes the package folder as root, and the
      # packer then writes its manifest into it.
      - name: Build .kpkg
        run: sudo AIReaderKindle/build.sh kindle ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: kindle-${{ matrix.target }}
          path: AIReaderKindle/dist/*.kpkg

  qt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build AppImage
        run: AIReaderQt/build.sh appimage
      - uses: actions/upload-artifact@v4
        with:
          name: qt-appimage
          path: AIReaderQt/dist/*.AppImage

  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # One zip serves both browsers: Chrome loads it unpacked or from its
      # store, Firefox takes it as an .xpi once signed by addons.mozilla.org.
      - name: Zip
        run: |
          cd BrowserExtension
          zip -qr ../AIReader-extension.zip . -x README.md
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: AIReader-extension.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ios, kindle, qt, extension]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" files/* --repo "$GITHUB_REPOSITORY" --generate-notes
